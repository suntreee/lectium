<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lectium Bookmarklet</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f2ea;
        color: #20242a;
      }

      body {
        margin: 0;
      }

      main {
        width: min(720px, calc(100% - 36px));
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(34px, 7vw, 64px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        font-size: 17px;
        line-height: 1.7;
        margin: 0 0 18px;
        color: #4a5564;
      }

      .install {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 34px 0 28px;
      }

      .bookmarklet {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        background: #0f766e;
        color: white;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(15, 118, 110, 0.22);
      }

      .note {
        font-size: 14px;
        color: #667085;
      }

      code,
      textarea {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 160px;
        resize: vertical;
        border: 1px solid #cbd5df;
        border-radius: 8px;
        padding: 12px;
        background: #fffdf8;
        color: #1f2933;
        font-size: 12px;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111827;
          color: #f3f4f6;
        }

        p,
        .note {
          color: #b8c0cc;
        }

        textarea {
          background: #0b1020;
          color: #e5e7eb;
          border-color: #374151;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lectium</h1>
      <p>把按钮拖到书签栏；在普通公开网页上点击它，会用当前页面内容生成一个干净的阅读层。</p>
      <p>它不会重新请求页面、不会处理登录或订阅限制，只做正文提取、排版、暗色模式、字号调节和打印。</p>

      <div class="install">
        <a id="bookmarklet" class="bookmarklet" href="#">Lectium</a>
        <span class="note">拖这个按钮到书签栏</span>
      </div>

      <p class="note">如果浏览器不允许拖拽，可以新建书签，并把下面这段完整复制到书签 URL。</p>
      <textarea id="code" readonly>正在生成书签脚本...</textarea>
    </main>

    <script>
      async function install() {
        const response = await fetch("./clean-read.bookmarklet.js", { cache: "no-store" });
        const source = await response.text();
        const bookmarklet = "javascript:" + encodeURIComponent(source);
        document.getElementById("bookmarklet").href = bookmarklet;
        document.getElementById("code").value = bookmarklet;
      }

      install().catch(() => {
        document.getElementById("code").value =
          "无法读取 clean-read.bookmarklet.js。请通过 https://suntreee.github.io/lectium/ 打开安装页，或在本地启动静态服务器后再打开。";
      });
    </script>
  </body>
</html>
